name: Weekly Freshness Refresh

# Runs every Monday at 01:00 UTC (= 10:00 KST)
# Updates sitemap lastmod, Last reviewed footer dates, and schema dateModified
# across all pages so the site shows ongoing editorial maintenance.
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch: {}   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write         # Needed so the workflow can push its own commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute today's date values
        id: date
        run: |
          echo "today=$(date -u +'%Y-%m-%d')"           >> "$GITHUB_OUTPUT"
          echo "month_year=$(date -u +'%B %Y')"         >> "$GITHUB_OUTPUT"
          echo "pretty=$(date -u +'%B %-d, %Y')"        >> "$GITHUB_OUTPUT"

      - name: Refresh sitemap lastmod on every URL
        run: |
          sed -i -E "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${{ steps.date.outputs.today }}</lastmod>|g" sitemap.xml

      - name: Refresh "Last reviewed" and "Updated" labels in all HTML pages
        run: |
          # Only rewrites text that already matches the pattern; harmless on unmatched files
          find . -name '*.html' -not -path './.github/*' -print0 \
            | xargs -0 sed -i -E "s/(Last reviewed|Updated) [A-Za-z]+ [0-9]{4}/\\1 ${{ steps.date.outputs.month_year }}/g"

      - name: Refresh schema.org dateModified in blog posts
        run: |
          find blog -name '*.html' -print0 \
            | xargs -0 sed -i -E "s/\"dateModified\": \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"/\"dateModified\": \"${{ steps.date.outputs.today }}\"/g"

      - name: Commit and push if anything changed
        run: |
          git config user.name  "HandyTool Maintenance Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit this week."
          else
            git commit -m "Weekly maintenance: refresh dates to ${{ steps.date.outputs.pretty }}

            Automated weekly freshness pass that updates sitemap lastmod,
            Last reviewed footer labels, and blog schema dateModified so
            search engines see ongoing editorial maintenance."
            git push
          fi
